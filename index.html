<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人收支管理系统 - 时间筛选版（增强日期选择）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
        }
        
        :root {
            --primary: #3498db;
            --primary-dark: #2980b9;
            --income: #2ecc71;
            --expense: #e74c3c;
            --warning: #f39c12;
            --cloud: #9b59b6;
            --profit: #e67e22;
            --category3: #e67e22;
            --category4: #34495e;
            --light: #f8f9fa;
            --dark: #2c3e50;
            --border: #ecf0f1;
            --shadow: 0 3px 8px rgba(0, 0, 0, 0.06);
            --radius: 6px;
            --transition: all 0.2s ease;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 12px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        /* 加载动画 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(52, 152, 219, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 导航栏 */
        .navbar {
            background: white;
            border-radius: var(--radius);
            padding: 10px 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
        }
        
        .nav-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .nav-icon {
            font-size: 18px;
            color: var(--primary);
        }
        
        .nav-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--dark);
        }
        
        .nav-subtitle {
            font-size: 10px;
            color: #7f8c8d;
            margin-top: 1px;
        }
        
        /* 主网格布局 */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 12px;
            margin-bottom: 12px;
        }
        
        /* 卡片样式 */
        .card {
            background: white;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            margin-bottom: 12px;
        }
        
        .card-header {
            padding: 10px 12px;
        }
        
        .card-header.primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        }
        
        .card-header.cloud {
            background: linear-gradient(135deg, var(--cloud), #8e44ad);
        }
        
        .card-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: white;
        }
        
        .card-body {
            padding: 12px;
        }
        
        /* 表单样式 */
        .form-group {
            margin-bottom: 12px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 4px;
            color: var(--dark);
            font-weight: 500;
            font-size: 11px;
        }
        
        .form-input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 5px;
            font-size: 12px;
            transition: var(--transition);
            background: white;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.1);
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        
        /* 分类选择器 */
        .category-selector {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 8px;
        }
        
        .category-group {
            display: flex;
            gap: 4px;
        }
        
        .category-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 3px;
            display: block;
        }
        
        .category-btn {
            flex: 1;
            padding: 6px 4px;
            border: 1px solid transparent;
            border-radius: 5px;
            background: white;
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }
        
        .category-btn.macau-up {
            color: var(--category3);
            border-color: var(--category3);
        }
        
        .category-btn.macau-up.active {
            background: var(--category3);
            color: white;
        }
        
        .category-btn.macau-down {
            color: var(--category4);
            border-color: var(--category4);
        }
        
        .category-btn.macau-down.active {
            background: var(--category4);
            color: white;
        }
        
        .category-btn.guangdong-up {
            color: var(--category3);
            border-color: var(--category3);
        }
        
        .category-btn.guangdong-up.active {
            background: var(--category3);
            color: white;
        }
        
        .category-btn.guangdong-down {
            color: var(--category4);
            border-color: var(--category4);
        }
        
        .category-btn.guangdong-down.active {
            background: var(--category4);
            color: white;
        }
        
        /* 按钮样式 */
        .btn {
            display: inline-block;
            padding: 8px 10px;
            border: none;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
        }
        
        .btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn-success {
            background: var(--income);
            color: white;
        }
        
        .btn-success:hover:not(:disabled) {
            background: #27ae60;
        }
        
        .btn-danger {
            background: var(--expense);
            color: white;
        }
        
        .btn-danger:hover:not(:disabled) {
            background: #c0392b;
        }
        
        .btn-outline {
            background: white;
            color: var(--primary);
            border: 1px solid var(--primary);
        }
        
        .btn-outline:hover:not(:disabled) {
            background: var(--primary);
            color: white;
        }
        
        .btn-warning {
            background: var(--warning);
            color: white;
        }
        
        .btn-warning:hover:not(:disabled) {
            background: #e67e22;
        }
        
        .btn-cloud {
            background: var(--cloud);
            color: white;
        }
        
        .btn-cloud:hover:not(:disabled) {
            background: #8e44ad;
        }
        
        .btn-sm {
            padding: 4px 6px;
            font-size: 10px;
        }
        
        .btn-group {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        
        /* 表格样式 */
        .table-container {
            overflow-x: auto;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid var(--border);
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }
        
        .data-table thead {
            background: #f8f9fa;
        }
        
        .data-table th {
            padding: 6px 8px;
            text-align: left;
            font-weight: 600;
            color: var(--dark);
            border-bottom: 1px solid var(--border);
            font-size: 10px;
        }
        
        .data-table td {
            padding: 6px 8px;
            border-bottom: 1px solid var(--border);
            font-size: 10px;
        }
        
        .data-table tbody tr:hover {
            background: rgba(52, 152, 219, 0.05);
        }
        
        .type-badge {
            display: inline-block;
            padding: 2px 4px;
            border-radius: 8px;
            font-size: 9px;
            font-weight: 500;
        }
        
        .type-income {
            background: rgba(46, 204, 113, 0.1);
            color: var(--income);
        }
        
        .type-expense {
            background: rgba(231, 76, 60, 0.1);
            color: var(--expense);
        }
        
        .type-profit {
            background: rgba(230, 126, 34, 0.1);
            color: var(--profit);
        }
        
        /* 筛选器 */
        .filter-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        
        .filter-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .filter-label {
            font-size: 10px;
            font-weight: 500;
            color: var(--dark);
        }
        
        .filter-select {
            padding: 4px 6px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 10px;
            background: white;
        }
        
        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 8px;
            margin-top: 10px;
        }
        
        .stat-card {
            background: white;
            border-radius: var(--radius);
            padding: 8px;
            box-shadow: var(--shadow);
        }
        
        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        
        .stat-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--dark);
        }
        
        .stat-amount {
            font-size: 14px;
            font-weight: 700;
        }
        
        .stat-income {
            color: var(--income);
        }
        
        .stat-expense {
            color: var(--expense);
        }
        
        .stat-profit {
            color: var(--profit);
        }
        
        .stat-details {
            font-size: 9px;
            color: #7f8c8d;
            margin-top: 4px;
        }
        
        /* 操作按钮 */
        .action-btn {
            padding: 2px 4px;
            border: none;
            border-radius: 3px;
            font-size: 9px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .action-delete {
            background: rgba(231, 76, 60, 0.1);
            color: var(--expense);
        }
        
        .action-delete:hover {
            background: var(--expense);
            color: white;
        }
        
        /* 分类统计标签 */
        .category-badge {
            display: inline-block;
            padding: 1px 4px;
            border-radius: 8px;
            font-size: 8px;
            font-weight: 500;
        }
        
        .category-badge.macau-up {
            background: rgba(230, 126, 34, 0.1);
            color: var(--category3);
        }
        
        .category-badge.macau-down {
            background: rgba(52, 73, 94, 0.1);
            color: var(--category4);
        }
        
        .category-badge.guangdong-up {
            background: rgba(230, 126, 34, 0.1);
            color: var(--category3);
        }
        
        .category-badge.guangdong-down {
            background: rgba(52, 73, 94, 0.1);
            color: var(--category4);
        }
        
        .category-badge.my-income {
            background: rgba(46, 204, 113, 0.2);
            color: var(--income);
            border: 1px dashed var(--income);
        }
        
        .category-badge.my-expense {
            background: rgba(231, 76, 60, 0.2);
            color: var(--expense);
            border: 1px dashed var(--expense);
        }
        
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 16px;
            color: #999;
            font-size: 11px;
        }
        
        /* 我的收支特别标记 */
        .my-income-row {
            background: rgba(46, 204, 113, 0.05) !important;
            border-left: 3px solid var(--income);
        }
        
        .my-expense-row {
            background: rgba(231, 76, 60, 0.05) !important;
            border-left: 3px solid var(--expense);
        }
        
        /* 收入支出提示样式 */
        .income-hint {
            color: var(--income);
            font-weight: 600;
            font-size: 10px;
        }
        
        .expense-hint {
            color: var(--expense);
            font-weight: 600;
            font-size: 10px;
        }
        
        .profit-hint {
            color: var(--profit);
            font-weight: 600;
            font-size: 10px;
        }
        
        /* 新增日期选择器样式 */
        .date-picker-container {
            margin-top: 8px;
            margin-bottom: 8px;
        }
        
        .date-selector {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .date-input {
            padding: 4px 6px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 10px;
            width: 100px;
        }
        
        .date-btn {
            padding: 4px 8px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 10px;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .date-btn:hover {
            background: var(--primary-dark);
        }
        
        .date-navigation {
            display: flex;
            gap: 4px;
        }
        
        /* 为详细记录表格容器添加垂直滚动 */
        .records-table-container {
            max-height: 400px;
            overflow-y: auto;
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 5px;
        }
        
        /* 响应式设计 */
        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            
            .container {
                max-width: 100%;
                padding: 0 6px;
            }
        }
        
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .filter-row {
                flex-direction: column;
            }
            
            .navbar {
                flex-direction: column;
                gap: 6px;
                align-items: stretch;
            }
            
            .btn-group {
                justify-content: center;
            }
            
            .category-group {
                flex-direction: column;
            }
            
            .date-selector {
                flex-direction: column;
                align-items: stretch;
            }
            
            .date-input {
                width: 100%;
            }
        }
        
        /* 小屏幕设备适配 */
        @media (max-width: 480px) {
            .stat-card {
                padding: 6px;
            }
            
            .stat-title {
                font-size: 10px;
            }
            
            .stat-amount {
                font-size: 12px;
            }
            
            .category-btn {
                font-size: 9px;
                padding: 5px 3px;
            }
            
            .btn {
                padding: 6px 8px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <!-- 加载动画 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div style="color: var(--primary); font-size: 12px;">正在加载数据...</div>
    </div>
    
    <div class="container">
        <!-- 导航栏 -->
        <nav class="navbar">
            <div class="nav-left">
                <div class="nav-icon">💰</div>
                <div>
                    <div class="nav-title">个人收支管理系统 - 时间筛选版（增强日期选择）</div>
                    <div class="nav-subtitle">澳门 & 粤港 - 下家总和减去上家总和=我的收支 | 粤港上家利润10%</div>
                </div>
            </div>
            <div class="btn-group">
                <button class="btn btn-outline btn-sm" id="export-btn">导出数据</button>
                <button class="btn btn-outline btn-sm" id="import-btn">导入数据</button>
                <button class="btn btn-warning btn-sm" id="clear-month-btn">清除当月</button>
                <button class="btn btn-danger btn-sm" id="clear-all-btn">清空数据</button>
            </div>
        </nav>
        
        <!-- 主内容区域 -->
        <div class="main-grid">
            <!-- 左栏：录入和管理 (现在占1/3) -->
            <div>
                <!-- 录入卡片 -->
                <div class="card">
                    <div class="card-header primary">
                        <div class="card-title">📝 录入收支记录</div>
                    </div>
                    <div class="card-body">
                        <!-- 分类选择 - 澳门上家和下家在同一行 -->
                        <div class="category-selector">
                            <div>
                                <div class="category-label">澳门分类：</div>
                                <div class="category-group">
                                    <button class="category-btn macau-up active" id="macau-up-btn" data-category="macau" data-subtype="up">
                                        <span>⬆️ 澳门上家</span>
                                    </button>
                                    <button class="category-btn macau-down" id="macau-down-btn" data-category="macau" data-subtype="down">
                                        <span>⬇️ 澳门下家</span>
                                    </button>
                                </div>
                            </div>
                            
                            <div>
                                <div class="category-label">粤港分类：</div>
                                <div class="category-group">
                                    <button class="category-btn guangdong-up" id="guangdong-up-btn" data-category="guangdong" data-subtype="up">
                                        <span>⬆️ 粤港上家</span>
                                    </button>
                                    <button class="category-btn guangdong-down" id="guangdong-down-btn" data-category="guangdong" data-subtype="down">
                                        <span>⬇️ 粤港下家</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">姓名</label>
                                <input type="text" id="person-name" placeholder="输入姓名" class="form-input" maxlength="20">
                            </div>
                            <div class="form-group">
                                <label class="form-label">日期</label>
                                <input type="date" id="record-date" class="form-input" max="9999-12-31">
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">金额</label>
                                <input type="number" id="record-amount" placeholder="输入金额" class="form-input" step="0.01" min="0.01" max="99999999.99">
                            </div>
                            <div class="form-group">
                                <label class="form-label">类型</label>
                                <select id="record-type" class="form-input">
                                    <option value="income">收入</option>
                                    <option value="expense">支出</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">备注/特码</label>
                            <input type="text" id="record-note" placeholder="输入备注（可选）" class="form-input" maxlength="50">
                        </div>
                        
                        <div class="btn-group">
                            <button class="btn btn-success" id="save-record-btn">保存记录</button>
                        </div>
                    </div>
                </div>
                
                <!-- 当天收支记录表格 - 添加日期选择器 -->
                <div class="card">
                    <div class="card-header primary">
                        <div class="card-title">📊 收支记录（按日期）</div>
                    </div>
                    <div class="card-body">
                        <!-- 日期选择器 -->
                        <div class="date-picker-container">
                            <div class="date-selector">
                                <label class="filter-label" for="today-date-select">选择日期：</label>
                                <input type="date" id="today-date-select" class="form-input date-input">
                                <div class="date-navigation">
                                    <button class="date-btn" id="prev-day-btn">前一天</button>
                                    <button class="date-btn" id="next-day-btn">后一天</button>
                                    <button class="date-btn" id="today-btn">今天</button>
                                </div>
                            </div>
                        </div>
                        
                        <div class="table-container">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>姓名/类型</th>
                                        <th>分类</th>
                                        <th>类型</th>
                                        <th>金额</th>
                                        <th>利润</th>
                                        <th>备注</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="today-records-body">
                                    <tr>
                                        <td colspan="7" class="empty-state">暂无当天记录</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                
                <!-- 当天我的收支统计 -->
                <div class="card">
                    <div class="card-header primary">
                        <div class="card-title" id="my-income-title">💰 当天我的收支统计</div>
                    </div>
                    <div class="card-body">
                        <div id="my-income-stats" class="stats-grid">
                            <!-- 我的收支统计卡片会动态显示在这里 -->
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 右栏：查看和统计 (现在占2/3) -->
            <div>
                <!-- 查看记录 -->
                <div class="card">
                    <div class="card-header primary">
                        <div class="card-title">📈 查看详细记录</div>
                    </div>
                    <div class="card-body">
                        <!-- 筛选器 - 已修改为年份和月份筛选 -->
                        <div class="filter-row">
                            <div class="filter-group">
                                <label class="filter-label">选择年份：</label>
                                <select id="select-year" class="filter-select">
                                    <option value="all">全部年份</option>
                                </select>
                            </div>
                            <div class="filter-group">
                                <label class="filter-label">选择月份：</label>
                                <select id="select-month" class="filter-select">
                                    <option value="all">全部月份</option>
                                    <option value="1">1月</option>

                                    <option value="6">6月</option>
                                    <option value="7">7月</option>
                                    <option value="8">8月</option>
                                    <option value="9">9月</option>
                                    <option value="10">10月</option>
                                    <option value="11">11月</option>

                            <div class="filter-group">
                                <label class="filter-label">筛选分类：</label>
                                <select id="filter-category" class="filter-select">
                                    <option value="all">全部分类</option>
                                    <option value="macau-up">澳门上家</option>
                                    <option value="macau-down">澳门下家</option>
                                    <option value="guangdong-up">粤港上家</option>
                                    <option value="guangdong-down">粤港下家</option>
                                    <option value="my-income">我的收支</option>
                                </select>
                            </div>
                            <div class="filter-group">
                                <label class="filter-label">筛选姓名：</label>
                                <select id="filter-person" class="filter-select">
                                    <option value="all">全部人员</option>

                            </div>
                        </div>
                        
                        <!-- 表格容器 - 添加滚动条 -->
                        <div class="records-table-container" id="detailed-records-container">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>日期</th>
                                        <th>姓名/类型</th>
                                        <th>分类</th>
                                        <th>类型</th>
                                        <th>金额</th>
                                        <th>利润</th>
                                        <th>备注</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="records-body">
                                    <tr>
                                        <td colspan="8" class="empty-state">暂无记录</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        
                        <!-- 统计卡片 -->
                        <div id="summary-stats" class="stats-grid">
                            <!-- 统计卡片会动态显示在这里 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 个人收支管理系统 - 优化版
        (function() {
            'use strict';
            
            // 应用状态管理
            const AppState = {
                records: [],
                selectedCategory: 'macau',
                selectedSubtype: 'up',
                selectedDate: new Date().toISOString().split('T')[0],
                
                // 添加示例数据用于测试
                demoData: [
                    {
                        id: 'demo_1',
                        date: new Date().toISOString().split('T')[0],
                        name: '张三',
                        category: 'macau',
                        subtype: 'up',
                        type: 'income',
                        amount: 1000,
                        note: '示例收入'
                    },
                    {
                        id: 'demo_2',
                        date: new Date().toISOString().split('T')[0],
                        name: '李四',
                        category: 'macau',
                        subtype: 'down',
                        type: 'expense',
                        amount: -500,
                        note: '示例支出'
                    },
                    {
                        id: 'demo_3',
                        date: new Date(Date.now() - 86400000).toISOString().split('T')[0], // 昨天
                        name: '王五',
                        category: 'guangdong',
                        subtype: 'up',
                        type: 'income',
                        amount: 800,
                        note: '粤港上家'
                    }
                ]
            };
            
            // DOM元素引用缓存
            const elements = {
                // 表单元素
                personName: document.getElementById('person-name'),
                recordDate: document.getElementById('record-date'),
                recordType: document.getElementById('record-type'),
                recordAmount: document.getElementById('record-amount'),
                recordNote: document.getElementById('record-note'),
                
                // 分类按钮
                macauUpBtn: document.getElementById('macau-up-btn'),
                macauDownBtn: document.getElementById('macau-down-btn'),
                guangdongUpBtn: document.getElementById('guangdong-up-btn'),
                guangdongDownBtn: document.getElementById('guangdong-down-btn'),
                
                // 保存按钮
                saveRecordBtn: document.getElementById('save-record-btn'),
                
                // 表格元素
                todayRecordsBody: document.getElementById('today-records-body'),
                recordsBody: document.getElementById('records-body'),
                summaryStats: document.getElementById('summary-stats'),
                myIncomeStats: document.getElementById('my-income-stats'),
                myIncomeTitle: document.getElementById('my-income-title'),
                
                // 筛选器元素
                todayDateSelect: document.getElementById('today-date-select'),
                selectYear: document.getElementById('select-year'),
                selectMonth: document.getElementById('select-month'),
                filterCategory: document.getElementById('filter-category'),
                filterPerson: document.getElementById('filter-person'),
                
                // 导航按钮
                prevDayBtn: document.getElementById('prev-day-btn'),
                nextDayBtn: document.getElementById('next-day-btn'),
                todayBtn: document.getElementById('today-btn'),
                
                // 功能按钮
                exportBtn: document.getElementById('export-btn'),
                importBtn: document.getElementById('import-btn'),
                clearMonthBtn: document.getElementById('clear-month-btn'),
                clearAllBtn: document.getElementById('clear-all-btn'),
                
                // 加载动画
                loadingOverlay: document.getElementById('loadingOverlay')
            };
            
            // 工具函数
            const Utils = {
                // 显示提示消息
                showToast(message, isError = false) {
                    const toast = document.createElement('div');
                    toast.textContent = message;
                    toast.style.cssText = `
                        position: fixed;
                        top: 12px;
                        right: 12px;
                        background: ${isError ? '#e74c3c' : '#2ecc71'};
                        color: white;
                        padding: 6px 12px;
                        border-radius: 4px;
                        font-weight: 500;
                        font-size: 8px;
                        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
                        z-index: 1000;
                        opacity: 0;
                        transform: translateY(-20px);
                        transition: all 0.3s ease;
                    `;
                    
                    document.body.appendChild(toast);
                    
                    setTimeout(() => {
                        toast.style.opacity = '1';
                        toast.style.transform = 'translateY(0)';
                    }, 10);
                    
                    setTimeout(() => {
                        toast.style.opacity = '0';
                        toast.style.transform = 'translateY(-20px)';
                        setTimeout(() => {
                            if (toast.parentNode) {
                                document.body.removeChild(toast);
                            }
                        }, 300);
                    }, 3000);
                    
                    return toast;
                },
                
                // 格式化日期
                formatDate(dateStr) {
                    if (!dateStr) return '未知日期';
                    try {
                        const date = new Date(dateStr);
                        if (isNaN(date.getTime())) return dateStr;
                        return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
                    } catch (error) {
                        console.error('日期格式化错误:', error);
                        return dateStr;
                    }
                },
                
                // 获取前一天日期
                getPreviousDay(dateStr) {
                    try {
                        const date = new Date(dateStr);
                        date.setDate(date.getDate() - 1);
                        return date.toISOString().split('T')[0];
                    } catch (error) {
                        console.error('获取前一天日期错误:', error);
                        return dateStr;
                    }
                },
                
                // 获取后一天日期
                getNextDay(dateStr) {
                    try {
                        const date = new Date(dateStr);
                        date.setDate(date.getDate() + 1);
                        return date.toISOString().split('T')[0];
                    } catch (error) {
                        console.error('获取后一天日期错误:', error);
                        return dateStr;
                    }
                },
                
                // 获取今天日期
                getToday() {
                    return new Date().toISOString().split('T')[0];
                },
                
                // 获取当前月份的第一天
                getFirstDayOfMonth() {
                    const date = new Date();
                    return `${date.getFullYear()}-${(date.getMonth() + 1).toString().padStart(2, '0')}-01`;
                },
                
                // 数字格式化，保留两位小数
                formatCurrency(amount) {
                    if (typeof amount !== 'number' || isNaN(amount)) {
                        return '¥0.00';
                    }
                    const sign = amount >= 0 ? '+' : '-';
                    return `${sign}¥${Math.abs(amount).toFixed(2)}`;
                },
                
                // 验证表单输入
                validateForm(name, date, amount) {
                    if (!name || name.trim() === '') {
                        return { valid: false, message: '请输入姓名' };
                    }
                    
                    if (name.trim().length > 20) {
                        return { valid: false, message: '姓名不能超过20个字符' };
                    }
                    
                    if (!date) {
                        return { valid: false, message: '请选择日期' };
                    }
                    
                    if (isNaN(amount) || amount <= 0) {
                        return { valid: false, message: '请输入有效的金额' };
                    }
                    
                    if (amount > 99999999.99) {
                        return { valid: false, message: '金额不能超过99999999.99' };
                    }
                    
                    return { valid: true, message: '验证通过' };
                },
                
                // 防抖函数
                debounce(func, wait) {
                    let timeout;
                    return function executedFunction(...args) {
                        const later = () => {
                            clearTimeout(timeout);
                            func(...args);
                        };
                        clearTimeout(timeout);
                        timeout = setTimeout(later, wait);
                    };
                }
            };
            
            // 数据操作函数
            const DataManager = {
                // 保存到本地存储
                saveToLocalStorage() {
                    try {
                        const data = {
                            records: AppState.records,
                            savedAt: new Date().toISOString(),
                            version: '2.0',
                            appVersion: 'personal-finance-v2'
                        };
                        localStorage.setItem('finance_management_data', JSON.stringify(data));
                        return true;
                    } catch (error) {
                        console.error('本地存储保存失败:', error);
                        Utils.showToast('数据保存失败，请手动备份', true);
                        return false;
                    }
                },
                
                // 从本地存储加载
                loadFromLocalStorage() {
                    try {
                        const saved = localStorage.getItem('finance_management_data');
                        if (saved) {
                            const data = JSON.parse(saved);
                            // 验证数据结构
                            if (data && Array.isArray(data.records)) {
                                AppState.records = data.records;
                                return true;
                            }
                        }
                        return false;
                    } catch (error) {
                        console.error('本地存储加载失败:', error);
                        return false;
                    }
                },
                
                // 清空本地存储
                clearLocalStorage() {
                    try {
                        localStorage.removeItem('finance_management_data');
                        return true;
                    } catch (error) {
                        console.error('清空本地存储失败:', error);
                        return false;
                    }
                },
                
                // 导入数据
                importData(jsonString) {
                    try {
                        const data = JSON.parse(jsonString);
                        if (data && Array.isArray(data.records)) {
                            AppState.records = data.records;
                            this.saveToLocalStorage();
                            return { success: true, message: '数据导入成功' };
                        } else {
                            return { success: false, message: '数据格式不正确' };
                        }
                    } catch (error) {
                        console.error('数据导入失败:', error);
                        return { success: false, message: '数据解析失败' };
                    }
                },
                
                // 导出数据
                exportData() {
                    const data = {
                        records: AppState.records,
                        exportedAt: new Date().toISOString(),
                        version: '2.0',
                        totalRecords: AppState.records.length
                    };
                    return JSON.stringify(data, null, 2);
                },
                
                // 添加示例数据
                addDemoData() {
                    if (AppState.records.length === 0) {
                        AppState.records = [...AppState.demoData];
                        this.saveToLocalStorage();
                        return true;
                    }
                    return false;
                },
                
                // 清除当月数据
                clearCurrentMonthData() {
                    const firstDayOfMonth = Utils.getFirstDayOfMonth();
                    const today = Utils.getToday();
                    
                    const originalLength = AppState.records.length;
                    AppState.records = AppState.records.filter(record => {
                        return record.date < firstDayOfMonth || record.date > today;
                    });
                    
                    const removedCount = originalLength - AppState.records.length;
                    this.saveToLocalStorage();
                    return removedCount;
                }
            };
            
            // 计算相关函数
            const Calculator = {
                // 计算利润（粤港上家总收支乘以0.1）
                calculateProfit(record) {
                    if (!record) return 0;
                    if (record.category === 'guangdong' && record.subtype === 'up') {
                        return Number((record.amount * 0.1).toFixed(2));
                    }
                    return 0;
                },
                
                // 计算统计数据
                calculateStats(recordList) {
                    if (!Array.isArray(recordList)) {
                        return { income: 0, expense: 0, profit: 0, count: 0 };
                    }
                    
                    let income = 0;
                    let expense = 0;
                    
                    recordList.forEach(record => {
                        if (record.amount > 0) {
                            income += Number(record.amount);
                        } else {
                            expense += Number(record.amount);
                        }
                    });
                    
                    return {
                        income: Number(income.toFixed(2)),
                        expense: Number(Math.abs(expense).toFixed(2)),
                        profit: Number((income + expense).toFixed(2)),
                        count: recordList.length
                    };
                },
                
                // 获取分类标签
                getCategoryLabel(category, subtype) {
                    if (!category) return '未知';
                    
                    if (subtype === 'up') {
                        return category === 'macau' ? '澳门上家' : '粤港上家';
                    } else if (subtype === 'down') {
                        return category === 'macau' ? '澳门下家' : '粤港下家';
                    } else {
                        return category === 'macau' ? '澳门' : '粤港';
                    }
                },
                
                // 计算我的收支记录
                calculateMyIncomeRecords(records) {
                    if (!Array.isArray(records) || records.length === 0) {
                        return [];
                    }
                    
                    // 按日期分组
                    const recordsByDate = {};
                    records.forEach(record => {
                        if (!record.date) return;
                        if (!recordsByDate[record.date]) {
                            recordsByDate[record.date] = [];
                        }
                        recordsByDate[record.date].push(record);
                    });
                    
                    const myIncomeRecords = [];
                    
                    Object.keys(recordsByDate).forEach(date => {
                        const dateRecords = recordsByDate[date];
                        
                        // 计算澳门收支
                        const macauUpRecords = dateRecords.filter(r => r.category === 'macau' && r.subtype === 'up');
                        const macauDownRecords = dateRecords.filter(r => r.category === 'macau' && r.subtype === 'down');
                        
                        const macauUpTotal = this.calculateStats(macauUpRecords);
                        const macauDownTotal = this.calculateStats(macauDownRecords);
                        
                        // 澳门我的收支 = 澳门下家总和 - 澳门上家总和
                        const macauMyIncome = Number((macauDownTotal.profit - macauUpTotal.profit).toFixed(2));
                        
                        // 计算粤港收支
                        const guangdongUpRecords = dateRecords.filter(r => r.category === 'guangdong' && r.subtype === 'up');
                        const guangdongDownRecords = dateRecords.filter(r => r.category === 'guangdong' && r.subtype === 'down');
                        
                        const guangdongUpTotal = this.calculateStats(guangdongUpRecords);
                        const guangdongDownTotal = this.calculateStats(guangdongDownRecords);
                        
                        // 粤港我的收支 = 粤港下家总和 - 粤港上家总和
                        const guangdongMyIncome = Number((guangdongDownTotal.profit - guangdongUpTotal.profit).toFixed(2));
                        
                        // 计算粤港上家总利润
                        const guangdongUpProfit = this.calculateGuangdongUpProfit(guangdongUpRecords);
                        
                        // 总我的收支
                        const totalMyIncome = Number((macauMyIncome + guangdongMyIncome).toFixed(2));
                        
                        if (totalMyIncome !== 0) {
                            myIncomeRecords.push({
                                date,
                                name: '我的收支',
                                category: 'my-income',
                                type: totalMyIncome >= 0 ? 'income' : 'expense',
                                amount: totalMyIncome,
                                note: `澳门:${macauMyIncome >= 0 ? '+' : ''}${macauMyIncome.toFixed(2)} 粤港:${guangdongMyIncome >= 0 ? '+' : ''}${guangdongMyIncome.toFixed(2)} 上家利润:${guangdongUpProfit >= 0 ? '+' : ''}${guangdongUpProfit.toFixed(2)}`,
                                isVirtual: true
                            });
                        }
                    });
                    
                    return myIncomeRecords;
                },
                
                // 计算粤港上家总利润
                calculateGuangdongUpProfit(guangdongUpRecords) {
                    if (!Array.isArray(guangdongUpRecords)) return 0;
                    
                    let totalProfit = 0;
                    guangdongUpRecords.forEach(record => {
                        totalProfit += this.calculateProfit(record);
                    });
                    return Number(totalProfit.toFixed(2));
                },
                
                // 计算当天统计
                calculateDailyStats(dateRecords) {
                    if (!Array.isArray(dateRecords) || dateRecords.length === 0) {
                        return {
                            macau: { up: { profit: 0, income: 0, expense: 0, count: 0 }, 
                                    down: { profit: 0, income: 0, expense: 0, count: 0 }, 
                                    my: 0 },
                            guangdong: { up: { profit: 0, income: 0, expense: 0, count: 0 }, 
                                       down: { profit: 0, income: 0, expense: 0, count: 0 }, 
                                       my: 0 },
                            guangdongUpProfit: 0,
                            total: 0
                        };
                    }
                    
                    // 计算澳门收支
                    const macauUpRecords = dateRecords.filter(r => r.category === 'macau' && r.subtype === 'up');
                    const macauDownRecords = dateRecords.filter(r => r.category === 'macau' && r.subtype === 'down');
                    
                    const macauUpTotal = this.calculateStats(macauUpRecords);
                    const macauDownTotal = this.calculateStats(macauDownRecords);
                    
                    // 澳门我的收支 = 澳门下家总和 - 澳门上家总和
                    const macauMyIncome = Number((macauDownTotal.profit - macauUpTotal.profit).toFixed(2));
                    
                    // 计算粤港收支
                    const guangdongUpRecords = dateRecords.filter(r => r.category === 'guangdong' && r.subtype === 'up');
                    const guangdongDownRecords = dateRecords.filter(r => r.category === 'guangdong' && r.subtype === 'down');
                    
                    const guangdongUpTotal = this.calculateStats(guangdongUpRecords);
                    const guangdongDownTotal = this.calculateStats(guangdongDownRecords);
                    
                    // 粤港我的收支 = 粤港下家总和 - 粤港上家总和
                    const guangdongMyIncome = Number((guangdongDownTotal.profit - guangdongUpTotal.profit).toFixed(2));
                    
                    // 计算粤港上家总利润
                    const guangdongUpProfit = this.calculateGuangdongUpProfit(guangdongUpRecords);
                    
                    // 总我的收支
                    const totalMyIncome = Number((macauMyIncome + guangdongMyIncome).toFixed(2));
                    
                    return {
                        macau: {
                            up: macauUpTotal,
                            down: macauDownTotal,
                            my: macauMyIncome
                        },
                        guangdong: {
                            up: guangdongUpTotal,
                            down: guangdongDownTotal,
                            my: guangdongMyIncome
                        },
                        guangdongUpProfit: guangdongUpProfit,
                        total: totalMyIncome
                    };
                }
            };
            
            // UI渲染函数
            const UIManager = {
                // 更新年份筛选器
                updateYearFilter() {
                    const yearSelect = elements.selectYear;
                    yearSelect.innerHTML = '<option value="all">全部年份</option>';
                    
                    const years = new Set();
                    AppState.records.forEach(record => {
                        if (record && record.date) {
                            const year = record.date.split('-')[0];
                            if (year && year.length === 4) {
                                years.add(year);
                            }
                        }
                    });
                    
                    // 将年份排序（从大到小）
                    const sortedYears = Array.from(years).sort((a, b) => b - a);
                    
                    sortedYears.forEach(year => {
                        const option = document.createElement('option');
                        option.value = year;
                        option.textContent = `${year}年`;
                        yearSelect.appendChild(option);
                    });
                    
                    // 设置当前年份为选中状态
                    const currentYear = new Date().getFullYear().toString();
                    if (sortedYears.includes(currentYear)) {
                        yearSelect.value = currentYear;
                    }
                },
                
                // 更新人员筛选器
                updatePersonFilter() {
                    const filter = elements.filterPerson;
                    filter.innerHTML = '<option value="all">全部人员</option>';
                    
                    const persons = new Set();
                    AppState.records.forEach(record => {
                        if (record && record.name && record.name.trim()) {
                            persons.add(record.name.trim());
                        }
                    });
                    
                    const sortedPersons = Array.from(persons).sort();
                    
                    sortedPersons.forEach(person => {
                        const option = document.createElement('option');
                        option.value = person;
                        option.textContent = person;
                        filter.appendChild(option);
                    });
                },
                
                // 渲染当天记录表格
                renderTodayRecordsTable(records) {
                    const tbody = elements.todayRecordsBody;
                    
                    if (!Array.isArray(records) || records.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="7" class="empty-state">${AppState.selectedDate} 暂无记录</td></tr>`;
                        return;
                    }
                    
                    let html = '';
                    
                    // 按日期降序排序（最新日期在最上面）
                    const sortedRecords = [...records].sort((a, b) => b.id.localeCompare(a.id));
                    
                    sortedRecords.forEach(record => {
                        if (!record) return;
                        
                        const isIncome = record.amount > 0;
                        const categoryLabel = Calculator.getCategoryLabel(record.category, record.subtype);
                        const profit = Calculator.calculateProfit(record);
                        const isProfit = profit >= 0;
                        const profitClass = isProfit ? 'stat-profit' : 'stat-expense';
                        const profitHintClass = isProfit ? 'profit-hint' : 'expense-hint';
                        
                        html += `
                            <tr>
                                <td><strong>${record.name || '未知'}</strong></td>
                                <td>
                                    <span class="category-badge ${record.category}-${record.subtype}">
                                        ${categoryLabel}
                                    </span>
                                </td>
                                <td>
                                    <span class="type-badge ${isIncome ? 'type-income' : 'type-expense'}">
                                        ${isIncome ? '收入' : '支出'}
                                    </span>
                                </td>
                                <td class="${isIncome ? 'stat-income' : 'stat-expense'}">
                                    ${Utils.formatCurrency(record.amount)}
                                </td>
                                <td class="${profitClass}">
                                    ${profit !== 0 ? (profit > 0 ? '+' : '') + '¥' + Math.abs(profit).toFixed(2) : '-'}
                                </td>
                                <td>${record.note || '-'}</td>
                                <td>
                                    <button class="action-btn action-delete" onclick="deleteRecord('${record.id}')" title="删除记录">删除</button>
                                </td>
                            </tr>
                        `;
                    });
                    
                    tbody.innerHTML = html;
                },
                
                // 渲染我的收支统计
                renderMyIncomeStats(stats, date) {
                    const container = elements.myIncomeStats;
                    
                    if (!stats || !container) return;
                    
                    container.innerHTML = '';
                    
                    // 澳门我的收支卡片
                    const macauIsIncome = stats.macau.my >= 0;
                    const macauColorClass = macauIsIncome ? 'stat-income' : 'stat-expense';
                    const macauHintClass = macauIsIncome ? 'income-hint' : 'expense-hint';
                    const macauHintText = macauIsIncome ? `收入 ¥${Math.abs(stats.macau.my).toFixed(2)}` : `支出 ¥${Math.abs(stats.macau.my).toFixed(2)}`;
                    
                    // 澳门上家统计

                // 渲染记录表格
                renderRecordsTable(records) {
                    const tbody = elements.recordsBody;
                    
                    if (!Array.isArray(records) || records.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="8" class="empty-state">暂无记录</td></tr>';
                        return;
                    }
                    
                    let html = '';
                    
                    // 按日期降序排序（最新日期在最上面）
                    const sortedRecords = [...records].sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
                    
                    sortedRecords.forEach(record => {
                        if (!record) return;
                        
                        const isIncome = record.amount > 0;
                        const categoryLabel = Calculator.getCategoryLabel(record.category, record.subtype);
                        const profit = Calculator.calculateProfit(record);
                        const isProfit = profit >= 0;
                        const profitClass = isProfit ? 'stat-profit' : 'stat-expense';
                        const profitHintClass = isProfit ? 'profit-hint' : 'expense-hint';
                        
                        html += `
                            <tr>
                                <td>${record.date || '未知'}</td>
                                <td><strong>${record.name || '未知'}</strong></td>
                                <td>
                                    <span class="category-badge ${record.category}-${record.subtype}">
                                        ${categoryLabel}
                                    </span>
                                </td>
                                <td>
                                    <span class="type-badge ${isIncome ? 'type-income' : 'type-expense'}">
                                        ${isIncome ? '收入' : '支出'}
                                    </span>
                                </td>
                                <td class="${isIncome ? 'stat-income' : 'stat-expense'}">
                                    ${Utils.formatCurrency(record.amount)}
                                </td>
                                <td class="${profitClass}">
                                    ${profit !== 0 ? (profit > 0 ? '+' : '') + '¥' + Math.abs(profit).toFixed(2) : '-'}
                                </td>
                                <td>${record.note || '-'}</td>
                                <td>
                                    <button class="action-btn action-delete" onclick="deleteRecord('${record.id}')" title="删除记录">删除</button>
                                </td>
                            </tr>
                        `;
                    });
                    
                    tbody.innerHTML = html;
                },
                
                // 渲染我的收支记录
                renderMyIncomeRecords(records, selectedYear, selectedMonth) {
                    const tbody = elements.recordsBody;
                    const container = elements.summaryStats;
                    
                    const myIncomeRecords = Calculator.calculateMyIncomeRecords(records);
                    
                    if (!Array.isArray(myIncomeRecords) || myIncomeRecords.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="8" class="empty-state">暂无我的收支记录</td></tr>';
                        if (container) container.innerHTML = '';
                        return;
                    }
                    
                    let html = '';
                    
                    myIncomeRecords.forEach(record => {
                        if (!record) return;
                        
                        const isIncome = record.amount > 0;
                        const rowClass = isIncome ? 'my-income-row' : 'my-expense-row';
                        const badgeClass = isIncome ? 'my-income' : 'my-expense';
                        const badgeText = isIncome ? '我的收入' : '我的支出';
                        const hintClass = isIncome ? 'income-hint' : 'expense-hint';
                        const hintText = isIncome ? `收入 ¥${Math.abs(record.amount).toFixed(2)}` : `支出 ¥${Math.abs(record.amount).toFixed(2)}`;
                        
                        html += `
                            <tr class="${rowClass}">
                                <td>${record.date}</td>
                                <td><strong>${record.name}</strong></td>
                                <td>
                                    <span class="category-badge ${badgeClass}">
                                        ${badgeText}
                                    </span>
                                </td>

                                    <span style="color: #7f8c8d; font-size: 9px;">计算得出</span>
                                </td>
                            </tr>
                        `;

                    tbody.innerHTML = html;
                    
                    // 计算统计
                    const myIncomeStats = Calculator.calculateStats(myIncomeRecords);
                    const timeLabel = selectedYear === 'all' ? '全部' : `${selectedYear}年${selectedMonth === 'all' ? '' : selectedMonth + '月'}`;
                    const isIncome = myIncomeStats.profit >= 0;
                    const hintClass = isIncome ? 'income-hint' : 'expense-hint';
                    
                    if (container) {
                        container.innerHTML = `
                            <div class="stat-card">
                                <div class="stat-header">
                                    <div class="stat-title">我的收支 ${timeLabel}统计</div>
                                    <div class="stat-amount ${isIncome ? 'stat-income' : 'stat-expense'}">
                                        ${isIncome ? '+' : ''}¥${Math.abs(myIncomeStats.profit).toFixed(2)}
                                    </div>
                                </div>
                                <div class="${hintClass}" style="margin-top: 5px;">
                                    ${isIncome ? '收入' : '支出'} ¥${Math.abs(myIncomeStats.profit).toFixed(2)}

                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px;">
                                    <div>
                                        <div class="stat-label">总收入</div>
                                        <div class="stat-amount stat-income">+¥${myIncomeStats.income.toFixed(2)}</div>
                                    </div>
                                    <div>
                                        <div class="stat-label">总支出</div>
                                        <div class="stat-amount stat-expense">-¥${myIncomeStats.expense.toFixed(2)}</div>
                                    </div>
                                </div>
                                <div class="stat-details">记录数：${myIncomeStats.count}天</div>
                            </div>
                        `;
                    }
                },

                renderSummaryStats(records, selectedYear, selectedMonth, filterCategory) {
                    const container = elements.summaryStats;
                    
                    if (!Array.isArray(records) || records.length === 0 || !container) {
                        container.innerHTML = '';
                        return;
                    }
                    
                    const stats = Calculator.calculateStats(records);
                    const isIncome = stats.profit >= 0;
                    const timeLabel = selectedYear === 'all' ? '全部' : `${selectedYear}年${selectedMonth === 'all' ? '' : selectedMonth + '月'}`;
                    const categoryLabel = {
                        'all': '全部',
                        'macau-up': '澳门上家',
                        'macau-down': '澳门下家',
                        'guangdong-up': '粤港上家',
                        'guangdong-down': '粤港下家',
                        'my-income': '我的收支'
                    }[filterCategory] || '全部';
                    
                    container.innerHTML = `
                        <div class="stat-card">
                            <div class="stat-header">
                                <div class="stat-title">${categoryLabel} ${timeLabel}统计</div>
                                <div class="stat-amount ${isIncome ? 'stat-income' : 'stat-expense'}">

                            </div>

                        </div>
                    `;
                }
            };
            
            // 业务逻辑函数
            const BusinessLogic = {
                // 选择分类
                selectCategory(category, subtype) {
                    AppState.selectedCategory = category;
                    AppState.selectedSubtype = subtype;
                    
                    // 更新按钮样式
                    document.querySelectorAll('.category-btn').forEach(btn => {
                        btn.classList.remove('active');
                    });
                    
                    // 根据选择的分类和子类型激活对应的按钮
                    const activeBtn = document.querySelector(`.category-btn[data-category="${category}"][data-subtype="${subtype}"]`);
                    if (activeBtn) {
                        activeBtn.classList.add('active');
                    }
                },
                
                // 前一天按钮
                previousDay() {
                    const currentDate = AppState.selectedDate;
                    const newDate = Utils.getPreviousDay(currentDate);
                    elements.todayDateSelect.value = newDate;
                    AppState.selectedDate = newDate;
                    elements.myIncomeTitle.textContent = `💰 ${Utils.formatDate(newDate)} 我的收支统计`;
                    this.loadTodayRecords();
                    this.loadMyIncomeStats();
                },
                
                // 后一天按钮
                nextDay() {
                    const currentDate = AppState.selectedDate;
                    const newDate = Utils.getNextDay(currentDate);
                    elements.todayDateSelect.value = newDate;
                    AppState.selectedDate = newDate;
                    elements.myIncomeTitle.textContent = `💰 ${Utils.formatDate(newDate)} 我的收支统计`;
                    this.loadTodayRecords();
                    this.loadMyIncomeStats();
                },
                
                // 重置为今天
                resetToToday() {
                    const today = Utils.getToday();
                    elements.todayDateSelect.value = today;
                    AppState.selectedDate = today;
                    elements.myIncomeTitle.textContent = `💰 ${Utils.formatDate(today)} 我的收支统计`;
                    this.loadTodayRecords();
                    this.loadMyIncomeStats();
                },
                
                // 保存记录
                saveRecord() {
                    const name = elements.personName.value.trim();
                    const date = elements.recordDate.value;
                    const amount = parseFloat(elements.recordAmount.value);
                    const type = elements.recordType.value;
                    const note = elements.recordNote.value.trim();
                    const category = AppState.selectedCategory;
                    const subtype = AppState.selectedSubtype;
                    
                    // 验证输入
                    const validation = Utils.validateForm(name, date, amount);
                    if (!validation.valid) {
                        Utils.showToast(validation.message, true);
                        return;
                    }
                    
                    const record = {
                        id: Date.now() + '_' + Math.random().toString(36).substr(2, 9),
                        date,
                        name,
                        category,
                        subtype: subtype || '',
                        type,
                        amount: type === 'expense' ? -Math.abs(amount) :
